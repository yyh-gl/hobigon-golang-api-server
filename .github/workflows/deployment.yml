name: Deployment

on:
  push:
    tags:
      - 'v[1-9]+.[0-9]+.[0-9]+'

jobs:
  create_release_note:
    name: Create release note
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Make release note
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_rest_container_image_specified_version:
    name: Publish container image (specified version)
    runs-on: ubuntu-latest
    needs: create_release_note
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set VERSION environment
        env:
          REF: ${{ github.ref }}
        run: echo "VERSION=${REF##*/}" >> $GITHUB_ENV
      - name: Set TAG environment
        run: echo "TAG=${{ secrets.CONTAINER_REGISTORY }}/${{ github.repository }}/rest:${{ env.VERSION }}" >> $GITHUB_ENV
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.CONTAINER_REGISTORY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/rest/Dockerfile
          build-args: VERSION=${{ env.VERSION }}
          push: true
          tags: ${{ env.TAG }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
  
  publish_rest_container_image_latest_version:
    name: Publish container image (latest version)
    runs-on: ubuntu-latest
    needs: create_release_note
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set VERSION environment
        env:
          REF: ${{ github.ref }}
        run: echo "VERSION=${REF##*/}" >> $GITHUB_ENV
      - name: Set TAG environment
        run: echo "TAG=${{ secrets.CONTAINER_REGISTORY }}/${{ github.repository }}/rest:latest" >> $GITHUB_ENV
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.CONTAINER_REGISTORY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/rest/Dockerfile
          build-args: VERSION=${{ env.VERSION }}
          push: true
          tags: ${{ env.TAG }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache

  publish_cli_container_image_specified_version:
    name: Publish CLI container image (specified version)
    runs-on: ubuntu-latest
    needs: create_release_note
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set VERSION environment
        env:
          REF: ${{ github.ref }}
        run: echo "VERSION=${REF##*/}" >> $GITHUB_ENV
      - name: Set TAG environment
        run: echo "TAG=${{ secrets.CONTAINER_REGISTORY }}/${{ github.repository }}/cli:${{ env.VERSION }}" >> $GITHUB_ENV
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.CONTAINER_REGISTORY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/cli/Dockerfile
          build-args: VERSION=${{ env.VERSION }}
          push: true
          tags: ${{ env.TAG }}
          cache-from: type=local,src=/tmp/.buildx-cache-cli
          cache-to: type=local,dest=/tmp/.buildx-cache-cli

  publish_cli_container_image_latest_version:
    name: Publish CLI container image (latest version)
    runs-on: ubuntu-latest
    needs: create_release_note
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set VERSION environment
        env:
          REF: ${{ github.ref }}
        run: echo "VERSION=${REF##*/}" >> $GITHUB_ENV
      - name: Set TAG environment
        run: echo "TAG=${{ secrets.CONTAINER_REGISTORY }}/${{ github.repository }}/cli:latest" >> $GITHUB_ENV
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.CONTAINER_REGISTORY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/cli/Dockerfile
          build-args: VERSION=${{ env.VERSION }}
          push: true
          tags: ${{ env.TAG }}
          cache-from: type=local,src=/tmp/.buildx-cache-cli
          cache-to: type=local,dest=/tmp/.buildx-cache-cli

